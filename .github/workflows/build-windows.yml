name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --release
      - name: Build VST3
        run: cargo xtask bundle nova --release
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: target/bundled
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries needed by nih-plug and egui
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render GUI screenshots (headless, CPU)
        run: cargo run --release -p snapshot -- docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: nova-screenshots
          path: docs/screenshots
      - name: Render audio demos and sound checks
        run: cargo run --release -p demo_render -- target/demos
      - name: Audio demo summary
        run: |
          echo "## Nova audio demo metrics" >> "$GITHUB_STEP_SUMMARY"
          cat target/demos/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-audio-demos
          path: target/demos
