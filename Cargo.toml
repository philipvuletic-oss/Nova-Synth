[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "nova"
version = "0.1.0"
edition = "2021"
authors = ["Nova Audio"]
license = "GPL-3.0-or-later"
description = "Nova hybrid wavetable synthesizer"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug" }
rtrb = "0.4.0"
arc-swap = "1.9.3"
triple_buffer = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
realfft = "3.5.0"
rand_xoshiro = "0.8.1"

[dev-dependencies]
criterion = "0.8.2"
approx = "0.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
