[package]
name = "demo_render"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Offline audio demo renderer and objective sound checks for Nova"
publish = false

[dependencies]
nova = { path = "../.." }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["assert_process_allocs"] }
hound = "=3.5.1"
png = "0.18.1"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
